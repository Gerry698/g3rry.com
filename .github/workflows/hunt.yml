name: Test the hunt Worker

on:
  pull_request:
    branches: [main]
    paths: ['hunt/**', 'guestbook/src/lib/**', '.github/workflows/hunt.yml']
  push:
    branches: [main]
    paths: ['hunt/**', 'guestbook/src/lib/**', '.github/workflows/hunt.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hunt-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hunt
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: hunt/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      # Bundles the Worker with wrangler and runs it in workerd against a local D1 database (made-up puzzle data).
      - name: Test Workers
        run: npm test
