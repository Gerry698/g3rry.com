<header class="gallery-header wrap">
  <h1 id="collection-title">{{COLLECTION_TITLE}}<span class="gold-dot" aria-hidden="true">.</span></h1>
  <p>{{COLLECTION_SUMMARY}}</p>
</header>
<section class="photo-collection wrap" aria-label="Photograph collection">
  {{GALLERY_PHOTOS}}
</section>
<div class="collection-end wrap"><span class="gold-line" aria-hidden="true"></span><p>Thanks for looking.</p><div class="collection-links"><a class="text-link" href="/phantom/">How these are made <span aria-hidden="true">↗</span></a><a class="text-link" href="/">Back to my world <span aria-hidden="true">↗</span></a></div></div>
<dialog class="photo-dialog" id="photo-dialog" aria-labelledby="dialog-caption">
  <div class="dialog-toolbar"><p id="dialog-position" aria-live="polite"></p><div class="dialog-actions"><a class="dialog-button dialog-phantom" id="dialog-phantom">Enter Phantom <span aria-hidden="true">↗</span></a><button class="dialog-button" id="dialog-close" type="button" aria-label="Close photograph">Close <span aria-hidden="true">×</span></button></div></div>
  <div class="dialog-image-area" id="dialog-stage" aria-busy="false"><img id="dialog-image" alt="" width="1920" height="1280" hidden><p id="dialog-status" role="status" aria-live="polite"></p></div>
  <div class="dialog-bottom"><button class="dialog-button" id="dialog-previous" type="button" aria-label="Previous photograph"><span aria-hidden="true">←</span> Previous</button><p class="dialog-caption"><span id="dialog-caption"></span><span id="dialog-exposure"></span></p><button class="dialog-button" id="dialog-next" type="button" aria-label="Next photograph">Next <span aria-hidden="true">→</span></button></div>
</dialog>
